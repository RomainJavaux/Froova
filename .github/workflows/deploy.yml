name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = new release, rollback = go back to the previous release'
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

permissions:
  contents: read

# Never run two deployments at the same time, and never cancel one halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback')) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
      # Paths contain the Hostinger account name: as secrets they are masked in public logs.
      DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH || vars.HOSTINGER_DEPLOY_PATH }}
      PUBLIC_HTML: ${{ secrets.HOSTINGER_PUBLIC_HTML || vars.HOSTINGER_PUBLIC_HTML }}
      PHP_BIN: ${{ vars.HOSTINGER_PHP_BIN || 'php' }}
      APP_URL: ${{ vars.APP_URL }}
      ACTION: ${{ inputs.action || 'deploy' }}
      HAS_PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          missing=0
          for name in SSH_HOST SSH_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name (see DEPLOY.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup PHP
        if: env.ACTION == 'deploy'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_mysql, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: env.ACTION == 'deploy'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        if: env.ACTION == 'deploy'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend
        if: env.ACTION == 'deploy'
        run: |
          npm ci
          npm run build

      - name: Package release
        if: env.ACTION == 'deploy'
        run: |
          tar -czf "$RUNNER_TEMP/release.tgz" \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='database/*.sqlite*' \
            app bootstrap config database lang public resources/views routes vendor artisan composer.json composer.lock
          ls -lh "$RUNNER_TEMP/release.tgz"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Upload production .env
        if: env.HAS_PRODUCTION_ENV == 'true'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          ssh hostinger "mkdir -p '$DEPLOY_PATH/shared' && umask 077 && cat > '$DEPLOY_PATH/shared/.env'" <<< "$PRODUCTION_ENV"

      - name: Upload release
        if: env.ACTION == 'deploy'
        run: |
          ssh hostinger "mkdir -p '$DEPLOY_PATH'"
          scp "$RUNNER_TEMP/release.tgz" "hostinger:$DEPLOY_PATH/release-${GITHUB_SHA}.tgz"

      - name: Activate release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh hostinger \
            "ACTION='$ACTION' DEPLOY_PATH='$DEPLOY_PATH' PUBLIC_HTML='$PUBLIC_HTML' PHP_BIN='$PHP_BIN' RELEASE='$RELEASE' ARCHIVE='$DEPLOY_PATH/release-${GITHUB_SHA}.tgz' bash -s" \
            < deploy/remote.sh

      - name: Health check
        if: env.APP_URL != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$APP_URL/up" > /dev/null; then
              echo "✓ $APP_URL is up"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$APP_URL/up did not answer. Run the workflow with action=rollback to restore the previous release."
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
